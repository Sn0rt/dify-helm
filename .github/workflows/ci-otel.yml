name: CI - OpenTelemetry Integration Tests

on:
  push:
    branches:
      - main
      - 'support/*'
      - 'ci/*'
      - 'otel/*'
  pull_request:
    branches:
      - main
      - 'support/*'
  workflow_dispatch:

jobs:
  prepare-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind-k8s-version:
          - kindest/node:v1.29.0
    outputs:
      images: ${{ steps.extract-images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.2

      - name: Extract images from OpenTelemetry test configuration
        id: extract-images
        run: |
          # Create test values file temporarily to extract images
          cat > temp-values.yaml << 'EOF'
          api:
            otel:
              enabled: true
          worker:
            otel:
              enabled: true
          postgresql:
            enabled: true
          redis:
            enabled: true
          weaviate:
            enabled: true
          EOF
          
          # Extract images from Helm chart
          ./ci/scripts/extract-images.sh charts/dify temp-values.yaml
          
          # Add OpenTelemetry Collector images
          echo "otel/opentelemetry-collector-contrib:latest" >> images.txt
          echo "otel/opentelemetry-collector:latest" >> images.txt
          
          # Convert to JSON array for matrix
          cat images.txt | jq -R . | jq -s . > images.json
          echo "images=$(cat images.json)" >> $GITHUB_OUTPUT
          rm temp-values.yaml images.txt images.json

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          node_image: ${{ matrix.kind-k8s-version }}
          cluster_name: kind-otel

      - name: Pre-pull images to Kind nodes
        run: |
          # Load images into Kind cluster
          echo '${{ steps.extract-images.outputs.images }}' | jq -r '.[]' | while read image; do
            echo "Pre-pulling image: $image"
            docker pull "$image" || echo "Failed to pull $image, continuing..."
            kind load docker-image "$image" --name kind-otel || echo "Failed to load $image into kind, continuing..."
          done

  test-otel-integration:
    needs: prepare-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-case:
          - name: "otel-basic"
            values: "values-otel-test.yaml"
            description: "Basic OpenTelemetry integration test"
        kind-k8s-version:
          - kindest/node:v1.29.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.2

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          node_image: ${{ matrix.kind-k8s-version }}
          cluster_name: kind-otel-${{ matrix.test-case.name }}

      - name: Pre-load images
        run: |
          echo '${{ needs.prepare-images.outputs.images }}' | jq -r '.[]' | while read image; do
            echo "Loading image: $image"
            docker pull "$image" || echo "Failed to pull $image, continuing..."
            kind load docker-image "$image" --name kind-otel-${{ matrix.test-case.name }} || echo "Failed to load $image into kind, continuing..."
          done

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add weaviate https://weaviate.github.io/weaviate-helm
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Deploy PostgreSQL
        run: |
          helm install postgresql bitnami/postgresql \
            --set global.postgresql.auth.database=dify \
            --set global.postgresql.auth.username=dify \
            --set global.postgresql.auth.password=dify123 \
            --set primary.persistence.enabled=false \
            --wait --timeout 10m

      - name: Deploy Redis
        run: |
          helm install redis bitnami/redis \
            --set auth.password=redis123 \
            --set master.persistence.enabled=false \
            --set replica.persistence.enabled=false \
            --wait --timeout 10m

      - name: Deploy Weaviate
        run: |
          helm install weaviate weaviate/weaviate \
            --set authentication.apikey.enabled=true \
            --set authentication.apikey.allowed_keys[0]=test-weaviate-key \
            --set authentication.apikey.users[0]=dify@example.com \
            --set authorization.admin_list.enabled=true \
            --set authorization.admin_list.users[0]=dify@example.com \
            --set storage.size=1Gi \
            --wait --timeout 10m

      - name: Create OpenTelemetry Collector ConfigMap
        run: |
          kubectl create configmap otel-collector-config --from-file=ci/otel-collector-config.yaml

      - name: Deploy OpenTelemetry Collector
        run: |
          helm install otel-collector open-telemetry/opentelemetry-collector \
            --set mode=deployment \
            --set image.repository=otel/opentelemetry-collector-contrib \
            --set image.tag=latest \
            --set configMap.create=false \
            --set configMap.existingName=otel-collector-config \
            --set ports.otlp.enabled=true \
            --set ports.otlp-http.enabled=true \
            --set service.type=ClusterIP \
            --wait --timeout 10m

      - name: Wait for OpenTelemetry Collector to be ready
        run: |
          kubectl wait --for=condition=available deployment/otel-collector-opentelemetry-collector --timeout=300s
          kubectl get service otel-collector-opentelemetry-collector

      - name: Deploy Dify with OTEL configuration
        run: |
          ./ci/scripts/deploy-and-test.sh charts/dify ci/values/${{ matrix.test-case.values }}

      - name: Run OTEL integration tests
        run: |
          ./ci/scripts/test-otel-integration.sh

      - name: Get cluster info for debugging
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info
          echo "=== All Pods ==="
          kubectl get pods -A
          echo "=== Events ==="
          kubectl get events --sort-by=.metadata.creationTimestamp
          echo "=== OTEL Collector Logs ==="
          kubectl logs deployment/otel-collector-opentelemetry-collector --tail=100 || true
          echo "=== Dify API Logs ==="
          kubectl logs deployment/dify-api --tail=50 || true
          echo "=== Dify Worker Logs ==="
          kubectl logs deployment/dify-worker --tail=50 || true

  test-summary:
    if: always()
    needs: [test-otel-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-otel-integration.result }}" == "success" ]]; then
            echo "✅ OpenTelemetry integration tests passed!"
          else
            echo "❌ OpenTelemetry integration tests failed!"
            exit 1
          fi