receivers:
  # OTLP receiver for receiving traces and metrics from Dify applications
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"
          allowed_headers:
            - "*"

  # Health check receiver for monitoring collector status
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  # Batch processor to improve performance and reduce requests
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter to prevent out of memory issues
  memory_limiter:
    limit_mib: 512

  # Resource processor to add standard attributes
  resource:
    attributes:
      - key: service.name
        value: dify
        action: upsert
      - key: deployment.environment
        value: ci-test
        action: upsert

exporters:
  # Logging exporter for debugging - outputs all telemetry data to console
  logging:
    verbosity: detailed
    sampling_initial: 100
    sampling_thereafter: 100

  # File exporter for persistent storage during tests
  file:
    path: /tmp/otel-data.json
    rotation:
      max_megabytes: 10
      max_days: 1
      max_backups: 3

  # Debug exporter for detailed debugging information
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiler
  pprof:
    endpoint: 0.0.0.0:1777

  # ZPages extension for debugging
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging, file, debug]

    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [logging, file, debug]

    # Logs pipeline (if Dify sends logs via OTLP)
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging, file, debug]

  # Telemetry configuration for the collector itself
  telemetry:
    logs:
      level: "debug"
    metrics:
      address: 0.0.0.0:8888