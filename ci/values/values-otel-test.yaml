# Values file for OpenTelemetry integration testing
# This configuration enables OTEL and connects to the deployed OpenTelemetry Collector

image:
  api:
    repository: langgenius/dify-api
    tag: "1.7.1"
    pullPolicy: IfNotPresent

  web:
    repository: langgenius/dify-web
    tag: "1.7.1"
    pullPolicy: IfNotPresent

  sandbox:
    repository: langgenius/dify-sandbox
    tag: "0.2.12"
    pullPolicy: IfNotPresent

  proxy:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent

  ssrfProxy:
    repository: ubuntu/squid
    tag: latest
    pullPolicy: IfNotPresent

  pluginDaemon:
    repository: langgenius/dify-plugin-daemon
    tag: 0.2.0-local
    pullPolicy: IfNotPresent

api:
  enabled: true
  replicas: 1
  resources: {}
  
  # Configure for CI testing
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  # OpenTelemetry configuration for API
  otel:
    enabled: true
    # Connect to our deployed OpenTelemetry Collector
    baseEndpoint: "http://otel-collector-opentelemetry-collector:4318"
    traceEndpoint: "http://otel-collector-opentelemetry-collector:4318/v1/traces"
    metricEndpoint: "http://otel-collector-opentelemetry-collector:4318/v1/metrics"
    # Test API key
    apiKey: "test-otel-api-key-for-ci"
    exporterProtocol: "http/protobuf"
    exporterType: "otlp"
    # High sampling rate for testing to capture all traces
    samplingRate: "1.0"
    batchExportScheduleDelay: "1000"
    maxQueueSize: "2048"
    maxExportBatchSize: "512"
    metricExportInterval: "10000"
    batchExportTimeout: "5000"
    metricExportTimeout: "10000"

  extraEnv:
    - name: CHECK_UPDATE_URL
      value: ""
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: TEMPLATE_TRANSFORM_MAX_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "30"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "30"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"

  # Database configuration for CI
  secretKey: "dify-ci-test-secret-key-for-otel-testing"
  migration: true

worker:
  enabled: true
  replicas: 1
  resources: {}

  # OpenTelemetry configuration for Worker
  otel:
    enabled: true
    # Connect to our deployed OpenTelemetry Collector
    baseEndpoint: "http://otel-collector-opentelemetry-collector:4318"
    traceEndpoint: "http://otel-collector-opentelemetry-collector:4318/v1/traces"
    metricEndpoint: "http://otel-collector-opentelemetry-collector:4318/v1/metrics"
    # Test API key
    apiKey: "test-otel-api-key-for-ci"
    exporterProtocol: "http/protobuf"
    exporterType: "otlp"
    # High sampling rate for testing to capture all traces
    samplingRate: "1.0"
    batchExportScheduleDelay: "1000"
    maxQueueSize: "2048"
    maxExportBatchSize: "512"
    metricExportInterval: "10000"
    batchExportTimeout: "5000"
    metricExportTimeout: "10000"

  logLevel: INFO

proxy:
  enabled: true
  replicas: 1
  resources: {}

web:
  enabled: true
  replicas: 1
  resources: {}
  
  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  extraEnv:
    - name: EDITION
      value: "SELF_HOSTED"

sandbox:
  enabled: true
  replicas: 1
  resources: {}
  
  livenessProbe:
    enabled: true
    initialDelaySeconds: 1
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 2
    successThreshold: 1
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 2
    successThreshold: 1

  auth:
    apiKey: "sandbox-api-key-for-ci-testing"

  extraEnv:
    - name: WORKER_TIMEOUT
      value: "15"

ssrfProxy:
  enabled: false

pluginDaemon:
  enabled: true
  replicas: 1
  resources: {}
  auth:
    serverKey: "lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi"
    difyApiKey: "QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1"

# External PostgreSQL configuration (use the one deployed in CI)
externalPostgres:
  enabled: true
  username: "dify"
  password: "dify123"
  address: "postgresql"
  port: 5432
  database:
    api: "dify"
    pluginDaemon: "dify_plugin"

# External Redis configuration (use the one deployed in CI)
externalRedis:
  enabled: true
  host: "redis-master"
  port: 6379
  username: ""
  password: "redis123"
  useSSL: false

# External Weaviate configuration (use the one deployed in CI)
externalWeaviate:
  enabled: true
  endpoint: "http://weaviate:8080"
  apiKey: "test-weaviate-key"

# Disable built-in components since we're using external ones in CI
postgresql:
  enabled: false

redis:
  enabled: false

weaviate:
  enabled: false

# Disable ExternalSecret for CI testing (use direct configuration)
externalSecret:
  enabled: false

# Service configuration
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

# Resource limits for CI
resources: {}

# Global node selector for CI
nodeSelector: {}

# Global tolerations for CI
tolerations: []

# Global affinity for CI
affinity: {}